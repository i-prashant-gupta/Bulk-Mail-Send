# Copy: sudo cp scripts/nginx-email-sender.conf /etc/nginx/sites-available/email-sender
#       sudo ln -s /etc/nginx/sites-available/email-sender /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl restart nginx
# HTTPS: sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;   # domain na ho to Elastic IP daal do

    # attachment upload ke liye (index.js ke MAX_ATTACHMENT_MB se thoda zyada)
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
